[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dataforge"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "platformdirs>=4.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "polars>=1.0",
    "deltalake>=0.18",
    "typer>=0.12",
    "rich>=13.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "PySide6>=6.7",
    # PySide6's binding runtime (it pins the matching version); the GUI imports isValid from it.
    "shiboken6",
    "croniter>=2.0",
    "twilio>=8",
    "pathspec>=0.12",
    # Imported by workspace scripts (scripts/functions/functions.py): the Pluggy HTTP calls and .env.
    "requests>=2.31",
    "python-dotenv>=1.0",
    # The IANA time zones zoneinfo reads: Windows has none, and polars turns a Datetime with a time
    # zone into a Python datetime with a ZoneInfo (the tables API answered 500 there, df-i4vo).
    "tzdata>=2026.6",
    # Reads the bank statement PDFs in data/extratos/ (scripts/report/extrato.py; pure Python).
    "pypdf>=7.1",
]

# Everything else the repo's tooling needs: tests, the test loop (scripts/testloop/) and coverage. One
# uv.lock pins these and the runtime dependencies for dev, CI and prod (`uv sync` installs both;
# prod skips this group). Renovate proposes the upgrades (.github/renovate.json5).
[dependency-groups]
dev = [
    "pytest>=9.2.0",
    # tests/conftest.py loads starlette.testclient, which deprecates plain httpx for httpx2.
    "httpx2>=2.16.0",
    "hypothesis>=6.170.14",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=5.1.0",
    "mutmut>=3.8.1",
    "diff-cover>=11.0.1",
    # .git/hooks/pre-commit runs the clone's .venv/bin/python -m pre_commit for every worktree.
    "pre-commit>=4.7.0",
    "pytest-xdist>=3.8",
    "pytest-split>=0.10",
]
# The quality gate's tools (scripts/quality/gate.py), pinned exactly: the baseline counts their
# findings, so a new version would move it. The gate refuses to run with other versions installed,
# and .pre-commit-config.yaml repeats these pins for its own environment.
quality = [
    "ruff==0.17.4",
    "vulture==2.16",
    "import-linter==2.16",
    "deptry==0.25.1",
]

[tool.uv]
required-version = ">=0.11.11"
# No release reaches the lock in its first 3 days: one yanked or found malicious is gone by then
# (df-is14). uv enforces it in every resolution, transitive dependencies and Renovate's lock file
# maintenance included, where Renovate's own minimumReleaseAge does not apply. An urgent fix:
# exclude-newer-package = { <name> = false }, removed once the release is old enough.
exclude-newer = "3 days"
# `uv sync` installs both groups; prod and the Windows smoke opt out (--no-default-groups).
default-groups = ["dev", "quality"]

[tool.ruff]
extend-exclude = ["scripts/testloop/evals"]

# The quality gate (scripts/quality/gate.py, docs/quality-gate.md) runs these rules against a
# baseline: existing findings are counted, and only new ones fail. A plain `ruff check` shows all.
[tool.ruff.lint]
preview = true
# Preview rules apply only when named by exact code (PLW1514 below), never through a family.
explicit-preview-rules = true
select = [
    # Bugs
    "F", "E9", "PLE", "B", "ASYNC", "DTZ",
    "PLW0603", "PLW1508", "PLW1510", "PLW2901",
    "RUF006", "RUF012", "RUF013", "RUF015", "RUF018", "RUF019", "RUF059",
    # Text files are UTF-8 on every machine: open() and read_text() without encoding= fall back
    # to the locale (cp1252 on Windows, ASCII under the C locale). Ruff only sees Path methods
    # when it can infer the type, so open() is always checked and read_text() only sometimes.
    "PLW1514",
    # Security: requests without timeout hang a pipeline forever; unsafe YAML, shell, SQL, pickle
    "S108", "S113", "S301", "S307", "S324", "S501", "S506", "S602", "S608",
    # Errors swallowed or blurred
    "BLE001", "S110", "S112", "TRY002", "TRY004", "TRY201", "TRY203", "TRY400", "TRY401",
    # Dead code
    "ERA001", "ARG",
    # Maintainability: complexity, size, magic values, simplifications
    "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "SIM",
    # Project conventions: imports at the top, config through dataforge.compat, honest suppressions
    "PLC0415", "TID251", "PGH004", "RUF100",
    # One condition per assert, so a failure names the one that broke (Sonar S9073, df-3lde)
    "PT018",
    # A function that returns a value says so on every path: no falling off the end (df-ahua.20)
    "RET503",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

# Configuration reaches the package through dataforge.compat (docs/subsystems/compat.md).
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os.environ".msg = "Read configuration through dataforge.compat, not os.environ."
"os.getenv".msg = "Read configuration through dataforge.compat, not os.getenv."
"yaml.load".msg = "Read YAML through dataforge.yamlio (libyaml), not yaml directly."
"yaml.safe_load".msg = "Read YAML through dataforge.yamlio (libyaml), not yaml directly."
"yaml.dump".msg = "Write YAML through dataforge.yamlio (libyaml), not yaml directly."
"yaml.safe_dump".msg = "Write YAML through dataforge.yamlio (libyaml), not yaml directly."
"polars.scan_delta".msg = "A server reads Delta through dataforge.delta_pool: a read on a thread that ends crashes Windows (df-5lk8)."
"polars.read_delta".msg = "A server reads Delta through dataforge.delta_pool: a read on a thread that ends crashes Windows (df-5lk8)."

[tool.ruff.lint.per-file-ignores]
"dataforge/compat.py" = ["TID251"]
"dataforge/yamlio.py" = ["TID251"]
"dataforge/delta_pool.py" = ["TID251"]
# The banned-api rule is for the package only: scripts and tests read their own environment.
"scripts/**" = ["TID251"]
"tests/**" = ["TID251", "PLR2004", "ARG", "PLC0415", "S108", "DTZ"]
# Workspace scripts load functions.py with exec(<path>.read_text(...)) (docs/scripts-conventions.md):
# its names are invisible to pyflakes.
"workspaces/**" = ["TID251", "F821"]
# A private workspace's own tests (df-rt6w) get the same allowances as tests/ (ruff unions the matches).
"workspaces/*/tests/**" = ["TID251", "PLR2004", "ARG", "PLC0415", "S108", "DTZ"]

[tool.vulture]
min_confidence = 60
# Frameworks call these, not our code: Typer commands, FastAPI routes, pydantic validators,
# pytest fixtures, Qt event overrides, and attributes that mocks, uvicorn or shlex read.
ignore_decorators = ["@*.command", "@router.*", "@app.*", "@field_validator", "@model_validator", "@pytest.fixture"]
ignore_names = ["*Event", "test_*", "pytest_*", "pytestmark", "side_effect", "return_value", "required_fields", "install_signal_handlers", "should_exit", "whitespace", "whitespace_split"]

# Dependency drift (deptry, run by the quality gate): an import with no declared dependency (DEP001),
# a declared dependency nothing imports (DEP002), a transitive one imported directly (DEP003).
# It reads the published code outside tests/; the gate adds the script modules that import each
# other as siblings (--known-first-party). Every exception below says why.
[tool.deptry]
# A workspace's own tests are test code, like tests/ (deptry's default exclude): pytest and
# hypothesis come from the dev group there (df-bsb2.2.2). So is dataforge.testing, the pytest plugin
# that tests/conftest.py and each workspace's tests/conftest.py load (df-xkhx.7): it lives in the
# package because that is the one place both suites import, but no module of the package imports it.
extend_exclude = ["workspaces/[^/]+/tests/", "dataforge/testing\\.py"]

# Distribution -> import name, spelled out so the answer is the same where the packages are not
# installed (CI's quality job, the pre-commit environment) as where they are.
[tool.deptry.package_module_name_map]
pyyaml = "yaml"
python-dotenv = "dotenv"
PySide6 = "PySide6"

[tool.deptry.per_rule_ignores]
# polars loads deltalake at run time for scan_delta / write_delta, and zoneinfo
# loads tzdata when the system has no time zone database; no file imports either by name.
DEP002 = ["deltalake", "tzdata"]

[tool.importlinter]
root_packages = ["dataforge", "ninho"]
include_external_packages = true

# The wall of ADR 0006: the product talks to the engine only through its command line, and the
# engine never knows the product.
[[tool.importlinter.contracts]]
name = "ninho does not import dataforge, and dataforge does not import ninho"
type = "independence"
modules = ["dataforge", "ninho"]

[[tool.importlinter.contracts]]
name = "Core does not import the surfaces (CLI, API, GUI)"
type = "forbidden"
source_modules = [
    "dataforge.engine", "dataforge.parser", "dataforge.dag", "dataforge.db", "dataforge.models",
    "dataforge.compat", "dataforge.tasks", "dataforge.conditions", "dataforge.deploy", "dataforge.apps",
    "dataforge.cron", "dataforge.runlock", "dataforge.instance", "dataforge.presence",
    "dataforge.app_backends", "dataforge.app_guard", "dataforge.shortcut",
]
forbidden_modules = ["dataforge.cli", "dataforge.api", "dataforge.gui"]

[[tool.importlinter.contracts]]
name = "The API does not import the CLI"
type = "forbidden"
source_modules = ["dataforge.api"]
forbidden_modules = ["dataforge.cli"]
# Known violation, tracked in beads: the OS scheduler registration lives in cli.py.
ignore_imports = ["dataforge.api.routers.triggers -> dataforge.cli"]

[[tool.importlinter.contracts]]
name = "The GUI talks to the daemon over HTTP, not to the core"
type = "forbidden"
source_modules = ["dataforge.gui"]
forbidden_modules = [
    "dataforge.engine", "dataforge.db", "dataforge.parser", "dataforge.deploy", "dataforge.tasks",
    "dataforge.dag",
]
# Small shared helpers, not core logic: a UTC clock and the deploy Action enum.
ignore_imports = [
    "dataforge.gui.panels.scheduler -> dataforge.db",
    "dataforge.gui.panels.deploy -> dataforge.deploy.models",
]

[[tool.importlinter.contracts]]
name = "Only the GUI imports Qt"
type = "forbidden"
source_modules = [
    "dataforge.engine", "dataforge.parser", "dataforge.dag", "dataforge.db", "dataforge.models",
    "dataforge.compat", "dataforge.tasks", "dataforge.conditions", "dataforge.deploy",
    "dataforge.api", "dataforge.apps", "dataforge.cron", "dataforge.runlock", "dataforge.instance", "dataforge.presence",
    "dataforge.app_backends", "dataforge.app_guard", "dataforge.shortcut",
]
forbidden_modules = ["PySide6"]
# The API reaches Qt only through the known API -> CLI import above (cli lazily imports the GUI).
ignore_imports = ["dataforge.api.routers.triggers -> dataforge.cli"]

[tool.coverage.run]
# Repo-relative paths in coverage.xml, so SonarQube Cloud matches them to its checkout (df-ahua.1.1).
relative_files = true

[tool.coverage.report]
# The line every workspace script starts with: it runs scripts/functions/functions.py in the script's
# namespace. The tests load the functions themselves and drop that line (compile_script in the
# workspace's tests/_delta_util.py), so no test can cover it.
exclude_also = ['^exec\(\(Path\(__file__\).*"functions\.py"\)\.read_text']

[tool.setuptools.packages.find]
include = ["dataforge*", "ninho*"]

[project.scripts]
dataforge = "dataforge.cli:app"
dataforge-gui = "dataforge.gui:run_app"
