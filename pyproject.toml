[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dataforge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "platformdirs>=4.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "polars>=1.0",
    "deltalake>=0.18",
    "typer>=0.12",
    "rich>=13.0",
    "openpyxl>=3.1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "PySide6>=6.7",
    "croniter>=2.0",
    "twilio>=8",
    "pathspec>=0.12",
]

[tool.ruff.lint]
# Text files are UTF-8 on every machine: open() and read_text() without encoding= fall back to
# the locale (cp1252 on Windows, ASCII under the C locale). Ruff only sees Path methods when it
# can infer the type, so open() is always checked and read_text()/write_text() only sometimes.
preview = true
explicit-preview-rules = true
select = ["PLW1514"]

[tool.setuptools.packages.find]
include = ["dataforge*"]

[project.scripts]
dataforge = "dataforge.cli:app"
dataforge-gui = "dataforge.gui:run_app"
