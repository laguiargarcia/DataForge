# SonarQube Cloud, run by the sonar job in .github/workflows/ci.yml (df-ahua.1).
# sonar.organization and sonar.projectKey come from the GitHub context in the sonar job (the
# defaults of a GitHub import: <owner> and <owner>_<repo>), so no account name lives in the repo.
sonar.projectName=DataForge

sonar.sources=dataforge,ninho,workspaces,scripts
# The GetFinance workspace's own tests and the ninho screen's browser test (its e2e/, with the
# server it starts, df-8x0m.23.13.5) are tests, not sources (a file cannot be both).
sonar.exclusions=workspaces/GetFinance/tests/**,ninho/telas/e2e/**
sonar.tests=tests,workspaces/GetFinance/tests,ninho/telas/e2e
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11,3.12,3.13

# Written by the tests job: the engine, GUI and GetFinance runs merged. It covers dataforge/,
# ninho/ (df-8x0m.23.13.8) and workspaces/GetFinance/scripts/ (df-bsb2.2.2).
sonar.python.coverage.reportPaths=coverage.xml
# No coverage run reaches the repo tooling under scripts/ (test_testloop.py runs in its own job
# without coverage), the GetFinance web app (its own Node tests, df-bsb2.2.3) or the ninho screen
# (its own Node tests too, df-8x0m.23.13.5), so they would fail every new-code coverage check. They
# are still analyzed for bugs, smells and duplication (df-ahua.1.5).
sonar.coverage.exclusions=scripts/**,workspaces/GetFinance/apps/**,ninho/telas/**

# Rules switched off on purpose. Each one has the reason and the bead with the decision.
sonar.issue.ignore.multicriteria=s8415
# python:S8415 wants every HTTPException listed in the route's responses=. That only changes the
# OpenAPI schema, which nothing reads: the GUI calls the API through a hand-written client, and
# runtime errors, details and logs are the same either way (df-ahe1, 2026-11-12). Turn it back on
# if a generated client ever consumes the schema.
sonar.issue.ignore.multicriteria.s8415.ruleKey=python:S8415
sonar.issue.ignore.multicriteria.s8415.resourceKey=dataforge/api/**
