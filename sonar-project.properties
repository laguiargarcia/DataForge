# SonarQube Cloud, run by the sonar job in .github/workflows/ci.yml (df-ahua.1).
# sonar.organization and sonar.projectKey come from the GitHub context in the sonar job (the
# defaults of a GitHub import: <owner> and <owner>_<repo>), so no account name lives in the repo.
sonar.projectName=DataForge

sonar.sources=dataforge,workspaces,scripts
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11,3.12,3.13

# Written by the tests job (engine + GUI runs merged); covers dataforge/ only.
sonar.python.coverage.reportPaths=coverage.xml
# No published tests reach the workspaces (GetFinance-Show) or the repo tooling under scripts/
# (test_testloop.py runs in its own job without coverage), so they would fail every new-code
# coverage check. They are still analyzed for bugs, smells and duplication (df-ahua.1.5).
sonar.coverage.exclusions=workspaces/**,scripts/**

# Rules switched off on purpose. Each one has the reason and the bead with the decision.
sonar.issue.ignore.multicriteria=s8415
# python:S8415 wants every HTTPException listed in the route's responses=. That only changes the
# OpenAPI schema, which nothing reads: the GUI calls the API through a hand-written client, and
# runtime errors, details and logs are the same either way (df-ahe1, 2026-11-12). Turn it back on
# if a generated client ever consumes the schema.
sonar.issue.ignore.multicriteria.s8415.ruleKey=python:S8415
sonar.issue.ignore.multicriteria.s8415.resourceKey=dataforge/api/**
