# 459 mutants, 6 survivors on a laptop (df-88xr):
#   _edicao_values lower-case or upper-case SQL: SQLite keywords and names are case-insensitive.
#   _parse_nested "XX{[XX": a text starting with X is parsed, fails, and is plain text all the same.
#   _raw_columns columns=None / dropped: reads every column, and only the wanted ones are looked up.
#   _amount_values amount > MIN_AMOUNT: MIN_AMOUNT itself is round (no cents), so it is left out either way.
