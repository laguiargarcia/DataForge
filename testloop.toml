process_isolation = "forkserver"
# 449 mutants, 67 s of mutate on a laptop when it was 351, about three times that in a CI job: two jobs.
shards = 2
# 14 survivors on a laptop:
#   _git check=None / dropped: check=False is the default, so the result is the same.
#   _git "core.quotepath=false" / "CORE.QUOTEPATH=FALSE": git config names and booleans ignore case.
#   _path_failures check_text(None, ...): `rel` only exempts uv.lock from the document patterns and
#     LICENSE/README.md from the name ones, and none of those names holds a finding of its own.
#   _decode "UTF-16" / "UTF-8" / "CP1252": codec names are case-insensitive.
#   _private_reason rsplit("/") / rsplit("/", 2): only the last part, [-1], is used.
#   _read_bytes `or True`: read_bytes on a missing path or a directory raises OSError, caught the same.
#     On a FIFO it would block, but git does not track one, so no caller passes it.
#   check_history check_text(None, ...) for a UTF-16 version (df-wkay): as in _path_failures, `rel` only
#     exempts some file names, and "history" is none of them.
#   _commit_parts batched strict=True / False / dropped: re.split with three groups, past its first
#     piece, always gives a multiple of three (df-nzhx).
#   check_history text=None for the log (df-ovkt): _git only asks `if text`, and None is false as False is.
# 4 more on the CI runner:
#   check_history -m dropped or -M: git 2.56 shows merge diffs and paths without -m; an older git
#     does not, and there the tests kill them.
# And on the runner x__utf16_blobs__mutmut_59 times out (it dies on the laptop); a timeout counts on
# neither side (df-hazn).
# min_score is the laptop's 437/449 less those 4 and that timeout: 432/448, what main measures.
min_score = 0.9642


