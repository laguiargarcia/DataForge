python = ".venv/bin/python"
# no:randomly: mutation and check need the same test order on every run (pytest-randomly shuffles it).
pytest_args = ["-o", "addopts=", "-p", "no:cacheprovider", "-p", "no:randomly"]
check_args = ["--hypothesis-profile=deterministic"]
env = { QT_QPA_PLATFORM = "offscreen" }

[targets."dataforge/deploy/plan.py"]
tests = ["tests/test_deploy_plan*.py"]
copy = ["dataforge/**/*.py", "tests/__init__.py", "tests/conftest.py"]
# Lowest mutation score `gate` accepts; CI fails below it. Raise it when the score rises.
min_score = 0.9437

[targets."dataforge/deploy/apply.py"]
tests = ["tests/test_deploy_apply*.py"]
copy = ["dataforge/**/*.py", "tests/__init__.py", "tests/conftest.py"]
min_score = 0.9715

[targets."dataforge/engine.py"]
tests = ["tests/test_engine*.py"]
copy = ["dataforge/**/*.py", "tests/__init__.py", "tests/conftest.py"]
min_score = 0.9893

[targets."dataforge/dag.py"]
tests = ["tests/test_dag*.py"]
copy = ["dataforge/**/*.py", "tests/__init__.py", "tests/conftest.py"]
min_score = 0.9777

[targets."dataforge/deploy/pairing.py"]
tests = ["tests/test_deploy_pairing*.py", "tests/test_deploy_plan*.py"]
copy = ["dataforge/**/*.py", "tests/__init__.py", "tests/conftest.py"]
min_score = 0.9197

[targets."scripts/leakguard.py"]
tests = ["tests/test_leakguard.py"]
copy = ["scripts/leakguard.py", "dataforge/**/*.py", "tests/__init__.py", "tests/conftest.py"]
min_score = 0.8823


[targets."dataforge/apps.py"]
tests = ["tests/test_apps*.py"]
copy = ["dataforge/**/*.py", "tests/__init__.py", "tests/conftest.py"]
min_score = 0.8073

[targets."dataforge/cron.py"]
tests = ["tests/test_cron*.py"]
copy = ["dataforge/**/*.py", "tests/__init__.py", "tests/conftest.py"]
# 5 survivors, all equivalent or declined (df-d3dy): split/rsplit on a span with 2+ '-' (any variant
# fails and passes through), the internal ValueError message, and // vs / on a sub-minute offset.
min_score = 0.9456

[targets."dataforge/conditions.py"]
tests = ["tests/test_conditions*.py"]
copy = ["dataforge/**/*.py", "tests/__init__.py", "tests/conftest.py"]
min_score = 1.0

[targets."dataforge/deploy/ignore.py"]
tests = ["tests/test_deploy_ignore*.py"]
copy = ["dataforge/**/*.py", "tests/__init__.py", "tests/conftest.py"]
# 2 survivors, both equivalent here: encoding "UTF-8" for "utf-8", and encoding=None, which is UTF-8
# under Linux's locale (test_ignore_file_is_read_as_utf8 catches it in the Windows test job).
min_score = 0.9259

[targets."dataforge/parser.py"]
tests = ["tests/test_parser*.py"]
copy = ["dataforge/**/*.py", "tests/__init__.py", "tests/conftest.py"]
# 19 survivors, all equivalent under Linux's UTF-8 locale: encoding "UTF-8", None or left out on the
# six open() calls (the UTF-8 tests catch them in the Windows test job), and sort_keys=None, which
# PyYAML reads as False.
min_score = 0.9233

[targets."dataforge/compat.py"]
tests = ["tests/test_compat*.py"]
copy = ["dataforge/**/*.py", "tests/__init__.py", "tests/conftest.py"]
# 5 survivors. Equivalent: parents=True/None/omitted on resolve_db's mkdir of <workspace>/data, since
# every caller passes a workspace that exists (resolve_workspace checked its workspace.yaml).
# Declined: the wording of the "not in a workspace" message (tests only check it names --workspace).
# No platform-only survivor: the Windows default home is tested by running platformdirs' Windows rule
# with its folder probe patched.
min_score = 0.9572

[targets."dataforge/db.py"]
tests = ["tests/test_db*.py"]
copy = ["dataforge/**/*.py", "tests/__init__.py", "tests/conftest.py"]
# No survivors. The schema SQL lives in the module constant _ADDED_COLUMNS, which mutmut does not mutate
# (nor the ORM class bodies): it mutates only the functions.
min_score = 1.0

[targets."dataforge/deploy/ledger.py"]
tests = ["tests/test_deploy_ledger*.py"]
copy = ["dataforge/**/*.py", "tests/__init__.py", "tests/conftest.py"]
# 11 survivors. Equivalent: split(":") variants in _hex (no sha the ledger writes or reads has a second
# ':'), rsplit("/") variants in is_temp_name (still the last segment), a missing log read as not clean
# (append rewrites an empty log first: same bytes), and encode "UTF-8" for "utf-8" (one codec; the
# encoding is explicit, so no locale case for the Windows job). Declined: the torn-line warning's
# wording (tests check it names the log file and the last line).
min_score = 0.9333

[targets."dataforge/deploy/rollback.py"]
tests = ["tests/test_deploy_rollback*.py"]
copy = ["dataforge/**/*.py", "tests/__init__.py", "tests/conftest.py"]
# 6 survivors, all equivalent: break -> return in _prune_empty_dirs (nothing follows the loop), and the
# order rollback prunes emptied folders in (5 sort variants): each walk climbs while a folder is empty,
# so the last walk through a shared parent removes it whatever the order (the LIFO property and the
# several-folders test cover nested and sibling folders). The crash sweep adds nothing here.
min_score = 0.85

[targets."dataforge/deploy/service.py"]
tests = ["tests/test_deploy_service*.py"]
copy = ["dataforge/**/*.py", "tests/__init__.py", "tests/conftest.py"]
# 2 survivors, both equivalent: applied=0 and entry_id=None dropped from the nothing-to-apply result,
# which are AutoDeployResult's defaults.
min_score = 0.989

[targets."dataforge/tasks/python_handler.py"]
tests = ["tests/test_python_handler*.py", "tests/test_env_file*.py"]
copy = ["dataforge/**/*.py", "tests/__init__.py", "tests/conftest.py"]
# 6 survivors. Equivalent: inicio=utcnow() set to None or left out (the column's default is utcnow,
# called at the insert a moment later), and the env file read with encoding "UTF-8" or None (one codec;
# None is UTF-8 under Linux's locale, and the env-file property's 'café' line catches it in the Windows
# test job). Declined: the wording of the missing-row log line (the test checks it names the row).
min_score = 0.9387

[targets."dataforge/tasks/job_handler.py"]
tests = ["tests/test_job_handler*.py"]
copy = ["dataforge/**/*.py", "tests/__init__.py", "tests/conftest.py"]
min_score = 1.0

[targets."dataforge/tasks/error_handler.py"]
tests = ["tests/test_error_handler*.py"]
copy = ["dataforge/**/*.py", "tests/__init__.py", "tests/conftest.py"]
# 2 survivors, both declined: the wording of the default message (tests check it is not empty).
min_score = 0.9428

[targets."dataforge/tasks/message/render.py"]
tests = ["tests/test_message_render*.py"]
copy = ["dataforge/**/*.py", "tests/__init__.py", "tests/conftest.py"]
min_score = 1.0

[targets."dataforge/tasks/message/dispatch.py"]
tests = ["tests/test_message_dispatch*.py"]
copy = ["dataforge/**/*.py", "tests/__init__.py", "tests/conftest.py"]
# 1 survivor, declined: the wording of the no-channel error (the test checks it says so).
min_score = 0.9565

[targets."dataforge/tasks/message/handler.py"]
tests = ["tests/test_message_handler*.py", "tests/test_env_file*.py"]
copy = ["dataforge/**/*.py", "tests/__init__.py", "tests/conftest.py"]
# 11 survivors. Equivalent: 7 mutants of the rc given to a succeeded or skipped task (only a failed
# task's rc is rendered, in {failed_tasks_summary}), and the env file read with encoding "UTF-8" or
# None (as in python_handler). Declined: the wording of the success output and of the no-channel
# error (tests check they name the channels). 4 mutants of _run_summary time out instead of failing
# fast (Hypothesis shrinks the failing example), which counts as caught.
min_score = 0.9519

[targets."dataforge/tasks/message/channels/__init__.py"]
tests = ["tests/test_message_channels*.py"]
copy = ["dataforge/**/*.py", "tests/__init__.py", "tests/conftest.py"]
min_score = 1.0

[targets."dataforge/tasks/message/channels/email.py"]
tests = ["tests/test_message_email*.py"]
copy = ["dataforge/**/*.py", "tests/__init__.py", "tests/conftest.py"]
# 4 survivors, all equivalent: the From and To header names in lower or upper case (header field names
# are case-insensitive, RFC 5322). The SMTP connection is a mock: no test touches the network.
min_score = 0.9402

[targets."dataforge/tasks/message/channels/twilio_sms.py"]
tests = ["tests/test_message_twilio*.py"]
copy = ["dataforge/**/*.py", "tests/__init__.py", "tests/conftest.py"]
min_score = 1.0

[targets."dataforge/tasks/message/channels/twilio_whatsapp.py"]
tests = ["tests/test_message_twilio*.py"]
copy = ["dataforge/**/*.py", "tests/__init__.py", "tests/conftest.py"]
min_score = 1.0

[targets."dataforge/deploy/models.py"]
tests = ["tests/test_deploy_models*.py"]
copy = ["dataforge/**/*.py", "tests/__init__.py", "tests/conftest.py"]
min_score = 1.0

[targets."dataforge/liveness.py"]
tests = ["tests/test_liveness*.py"]
copy = ["dataforge/**/*.py", "tests/__init__.py", "tests/conftest.py", "tests/process_owners.py"]
# 15 survivors, none Linux can see. Windows-only code: process_start's win32 branch (3) and the
# empty boot and pid namespace recorded off Linux (2; the Windows test job checks both). Equivalent:
# the 'if linux' guards forced true (2; /proc does not exist elsewhere, so the readers give "" anyway),
# the boot-id and stat reads with "UTF-8", None or no encoding (5; ASCII files, UTF-8 locale).
# Declined: Owner.dumps without sort_keys (3; parse_owner reads any key order, nothing compares the text).
min_score = 0.8897

[targets."dataforge/orphans.py"]
tests = ["tests/test_orphans*.py"]
copy = ["dataforge/**/*.py", "tests/__init__.py", "tests/conftest.py", "tests/process_owners.py"]
# 5 survivors. Equivalent: reconcile's `me` dropped or None (4; owner_is_gone then asks current_owner(),
# the same value, cached per process). Declined: the wording of the failure log line.
min_score = 0.9431
