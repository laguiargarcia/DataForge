python = ".venv/bin/python"
# no:randomly: mutation and check need the same test order on every run (pytest-randomly shuffles it).
pytest_args = ["-o", "addopts=", "-p", "no:cacheprovider", "-p", "no:randomly"]
check_args = ["--hypothesis-profile=deterministic"]
env = { QT_QPA_PLATFORM = "offscreen" }

[targets."dataforge/deploy/plan.py"]
tests = ["tests/test_deploy_plan*.py"]
copy = ["dataforge/**/*.py", "tests/__init__.py", "tests/conftest.py"]
# Lowest mutation score `gate` accepts; CI fails below it. Raise it when the score rises.
min_score = 0.9437

[targets."dataforge/deploy/apply.py"]
tests = ["tests/test_deploy_apply*.py"]
copy = ["dataforge/**/*.py", "tests/__init__.py", "tests/conftest.py"]
min_score = 0.9715

[targets."dataforge/engine.py"]
tests = ["tests/test_engine*.py"]
copy = ["dataforge/**/*.py", "tests/__init__.py", "tests/conftest.py"]
min_score = 0.9893

[targets."dataforge/dag.py"]
tests = ["tests/test_dag*.py"]
copy = ["dataforge/**/*.py", "tests/__init__.py", "tests/conftest.py"]
min_score = 0.9777

[targets."dataforge/deploy/pairing.py"]
tests = ["tests/test_deploy_pairing*.py", "tests/test_deploy_plan*.py"]
copy = ["dataforge/**/*.py", "tests/__init__.py", "tests/conftest.py"]
min_score = 0.9197

[targets."scripts/leakguard.py"]
tests = ["tests/test_leakguard.py"]
copy = ["scripts/leakguard.py", "dataforge/**/*.py", "tests/__init__.py", "tests/conftest.py"]
min_score = 0.8823


[targets."dataforge/apps.py"]
tests = ["tests/test_apps*.py"]
copy = ["dataforge/**/*.py", "tests/__init__.py", "tests/conftest.py"]
min_score = 0.8073

[targets."dataforge/cron.py"]
tests = ["tests/test_cron*.py"]
copy = ["dataforge/**/*.py", "tests/__init__.py", "tests/conftest.py"]
# 5 survivors, all equivalent or declined (df-d3dy): split/rsplit on a span with 2+ '-' (any variant
# fails and passes through), the internal ValueError message, and // vs / on a sub-minute offset.
min_score = 0.9456

[targets."dataforge/conditions.py"]
tests = ["tests/test_conditions*.py"]
copy = ["dataforge/**/*.py", "tests/__init__.py", "tests/conftest.py"]
min_score = 1.0

[targets."dataforge/deploy/ignore.py"]
tests = ["tests/test_deploy_ignore*.py"]
copy = ["dataforge/**/*.py", "tests/__init__.py", "tests/conftest.py"]
# 2 survivors, both equivalent here: encoding "UTF-8" for "utf-8", and encoding=None, which is UTF-8
# under Linux's locale (test_ignore_file_is_read_as_utf8 catches it in the Windows test job).
min_score = 0.9259

[targets."dataforge/parser.py"]
tests = ["tests/test_parser*.py"]
copy = ["dataforge/**/*.py", "tests/__init__.py", "tests/conftest.py"]
# 19 survivors, all equivalent under Linux's UTF-8 locale: encoding "UTF-8", None or left out on the
# six open() calls (the UTF-8 tests catch them in the Windows test job), and sort_keys=None, which
# PyYAML reads as False.
min_score = 0.9233

[targets."dataforge/compat.py"]
tests = ["tests/test_compat*.py"]
copy = ["dataforge/**/*.py", "tests/__init__.py", "tests/conftest.py"]
# 5 survivors. Equivalent: parents=True/None/omitted on resolve_db's mkdir of <workspace>/data, since
# every caller passes a workspace that exists (resolve_workspace checked its workspace.yaml).
# Declined: the wording of the "not in a workspace" message (tests only check it names --workspace).
# No platform-only survivor: the Windows default home is tested by running platformdirs' Windows rule
# with its folder probe patched.
min_score = 0.9572

[targets."dataforge/db.py"]
tests = ["tests/test_db*.py"]
copy = ["dataforge/**/*.py", "tests/__init__.py", "tests/conftest.py"]
# 6 survivors, all equivalent: init_db's SQL lower-cased (and PRAGMA table_info(job_runs) upper-cased),
# which SQLite reads the same, keywords and identifiers alike. mutmut does not mutate the ORM class
# bodies, only init_db and utcnow.
min_score = 1.0

[targets."dataforge/deploy/ledger.py"]
tests = ["tests/test_deploy_ledger*.py"]
copy = ["dataforge/**/*.py", "tests/__init__.py", "tests/conftest.py"]
# 11 survivors. Equivalent: split(":") variants in _hex (no sha the ledger writes or reads has a second
# ':'), rsplit("/") variants in is_temp_name (still the last segment), a missing log read as not clean
# (append rewrites an empty log first: same bytes), and encode "UTF-8" for "utf-8" (one codec; the
# encoding is explicit, so no locale case for the Windows job). Declined: the torn-line warning's
# wording (tests check it names the log file and the last line).
min_score = 0.9333

[targets."dataforge/deploy/rollback.py"]
tests = ["tests/test_deploy_rollback*.py"]
copy = ["dataforge/**/*.py", "tests/__init__.py", "tests/conftest.py"]
# 6 survivors, all equivalent: break -> return in _prune_empty_dirs (nothing follows the loop), and the
# order rollback prunes emptied folders in (5 sort variants): each walk climbs while a folder is empty,
# so the last walk through a shared parent removes it whatever the order (the LIFO property and the
# several-folders test cover nested and sibling folders). The crash sweep adds nothing here.
min_score = 0.85
