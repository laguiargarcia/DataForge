connections:
  raw:
    type: parquet_dir
    path: data/raw/
  cleansed:
    type: delta_dir
    path: data/cleansed/
  curated:
    type: delta_dir
    path: data/curated/
  edicao:
    type: sqlite_file
    path: data/edicao.db
  # Suspicious findings of the data checks, one JSON file per check (ADR 0004, df-ahua.3); read by
  # scripts/validation/data_warnings.py. Rewritten every run.
  validation:
    type: json_dir
    path: data/validation/
  # The bank statement PDFs (df-z4fh.5): the bank only exports PDF. The owner drops them here by hand or
  # uploads them through the Finanças app (its backend's POST /extratos writes here, df-7xk9.2). Read by the
  # task `extrato`; no pipeline script writes here. No rebuild: the backup job zips it with raw.
  extratos:
    type: pdf_dir
    path: data/extratos/
