# Local merchant_key normalization rules: the ones for your own banks.
#
# TEMPLATE. Copy this file to "merchant_normalization.local.yaml" in the same folder
# (gitignored: a description prefix tells which bank you use) and replace the example
# rule with yours. Same shape as merchant_normalization.yaml; these rules are tried
# first, so a rule here wins over a versioned one that matches the same description.
# Without the local file, only the versioned rules apply.
rules:
  - name: bank-a-debit-pos-prefix
    match: '^PREFIXO '
    strip:
      - '^PREFIXO '   # the bank's debit-POS channel prefix
      - '\d{4}$'      # trailing DDMM date code
