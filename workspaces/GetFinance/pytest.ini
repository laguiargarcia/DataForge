; Pipeline tests of this workspace (DataForge df-rt6w, ADR 0004). Each checkout tests itself:
; tests/_delta_util.py resolves the scripts from this checkout and the real data from GETFINANCE_DATA
; when it is set, else from the main checkout.
[pytest]
testpaths = tests
pythonpath = .
markers =
    integration: reads this machine's real data (GETFINANCE_DATA when set, else data/ of the main checkout), read-only; skipped where there is none (CI, a fresh clone)
