# `pre-commit install` installs all three: the commit checks below, the leak guard on the commit
# message and, after a merge or pull, the deploy to prod (scripts/prod/deploy.sh does nothing outside
# the main checkout on main).
default_install_hook_types: [pre-commit, commit-msg, post-merge]
# A hook with no `stages` runs on the staged files only; the message has its own hook below.
default_stages: [pre-commit]
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1   # same as GITLEAKS_VERSION in .github/workflows/ci.yml; Renovate bumps both together
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: leakguard
        name: leakguard (private files, personal data, real values)
        entry: python scripts/leakguard.py
        # python + polars, not the system python3: on the owner's machine the guard reads the real
        # workspace's raw parquet to list the real values (GETFINANCE_DATA, .leakguard-workspaces or a
        # workspaces/<name>/data/ of the main checkout). With none of them it fails outside CI; someone
        # with no real data at all sets LEAKGUARD_NO_REAL_DATA=1 (workspaces/GetFinance/README.md).
        language: python
        additional_dependencies: ["polars==1.41.2"]
        pass_filenames: true
        require_serial: true   # one process: each run reads every raw partition to list the real values
        always_run: false
      - id: leakguard-message
        name: leakguard (commit message)
        entry: python scripts/leakguard.py   # pre-commit passes the message file
        language: python
        additional_dependencies: ["polars==1.41.2"]
        stages: [commit-msg]
      - id: quality-gate
        name: quality gate (lint, dead code, import contracts against the baseline)
        # --stage: when findings were fixed, the lowered baseline goes into this same commit.
        entry: python scripts/quality/gate.py check --stage
        language: python
        # Same pins as the `quality` group in pyproject.toml; the gate fails if they drift apart.
        additional_dependencies: ["ruff==0.17.4", "vulture==2.16", "import-linter==2.16", "deptry==0.25.1"]
        pass_filenames: false
        # pyproject.toml holds the rules, the contracts and the dependencies deptry checks.
        files: '\.py$|^pyproject\.toml$'
      - id: deploy-prod
        name: deploy main to prod (scripts/prod/deploy.sh, df-n8ac.11)
        entry: scripts/prod/deploy.sh
        language: unsupported_script
        stages: [post-merge]
        always_run: true
        pass_filenames: false
        verbose: true
