# `pre-commit install` installs both: the commit checks below and, after a merge or pull, the
# deploy to prod (scripts/prod/deploy.sh does nothing outside the main checkout on main).
default_install_hook_types: [pre-commit, post-merge]
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3   # same as GITLEAKS_VERSION in .github/workflows/ci.yml: bump both together
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: leakguard
        name: leakguard (PII + private-path block)
        entry: python scripts/leakguard.py
        # python + polars, not the system python3: on the owner's machine the guard also runs the private
        # workspaces' tools/leakguard.py, which reads their raw parquet to list the real values (df-k37o).
        language: python
        additional_dependencies: ["polars==1.41.2"]
        pass_filenames: true
        require_serial: true   # one process: each run loads every private guard's real values
        always_run: false
      - id: quality-gate
        name: quality gate (lint, dead code, import contracts against the baseline)
        # --stage: when findings were fixed, the lowered baseline goes into this same commit.
        entry: python scripts/quality/gate.py check --stage
        language: python
        # Same pins as the `quality` group in pyproject.toml; the gate fails if they drift apart.
        additional_dependencies: ["ruff==0.17.4", "vulture==2.16", "import-linter==2.16", "deptry==0.25.1"]
        pass_filenames: false
        # pyproject.toml holds the rules, the contracts and the dependencies deptry checks.
        files: '\.py$|^pyproject\.toml$'
      - id: deploy-prod
        name: deploy main to prod (scripts/prod/deploy.sh, df-n8ac.11)
        entry: scripts/prod/deploy.sh
        language: unsupported_script
        stages: [post-merge]
        always_run: true
        pass_filenames: false
        verbose: true
