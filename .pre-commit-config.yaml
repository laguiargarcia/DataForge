repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3   # same as GITLEAKS_VERSION in .github/workflows/ci.yml: bump both together
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: leakguard
        name: leakguard (PII + private-path block)
        entry: python scripts/leakguard.py
        # python + polars, not the system python3: on the owner's machine the guard also runs the private
        # workspaces' tools/leakguard.py, which reads their raw parquet to list the real values (df-k37o).
        language: python
        additional_dependencies: ["polars==1.41.2"]
        pass_filenames: true
        require_serial: true   # one process: each run loads every private guard's real values
        always_run: false
      - id: quality-gate
        name: quality gate (lint, dead code, import contracts against the baseline)
        # --stage: when findings were fixed, the lowered baseline goes into this same commit.
        entry: python scripts/quality/gate.py check --stage
        language: python
        # Same pins as scripts/quality/requirements.txt; the gate fails if they drift apart.
        additional_dependencies: ["ruff==0.17.4", "vulture==2.16", "import-linter==2.16"]
        pass_filenames: false
        types: [python]
