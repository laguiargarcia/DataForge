# Dependency upgrades as pull requests (df-n8ac.12): each one runs the full CI against uv.lock, the
# one list of versions dev, CI and prod install. This replaces the weekly CI run's old job of catching
# breakage from new releases.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    ignore:
      # The quality gate's tools: the baseline counts their findings, so moving one is a deliberate
      # change made by hand together with .pre-commit-config.yaml (docs/quality-gate.md).
      - dependency-name: ruff
      - dependency-name: vulture
      - dependency-name: import-linter
      - dependency-name: deptry
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
