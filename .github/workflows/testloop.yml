name: testloop
# Tests of the test loop tools themselves (about 15 minutes), so only when they change,
# once a week, or by hand.
on:
  pull_request:
    paths: ["scripts/testloop/**", "testloop.toml", "tests/test_testloop.py", ".github/workflows/testloop.yml"]
  push:
    branches: [main]
    paths: ["scripts/testloop/**", "testloop.toml", "tests/test_testloop.py", ".github/workflows/testloop.yml"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: pip install -e . pytest==9.2.0 -r scripts/testloop/requirements.txt
      - name: Test loop tool tests
        run: python -m pytest tests/test_testloop.py -p no:cacheprovider
