name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# One run at a time per ref (df-huj7). On main, runs queue instead of overlapping: SonarCloud refuses
# an analysis of an older commit submitted after a newer one, which failed the sonar job when merges
# landed seconds apart. A queued run that a newer push replaces is cancelled; the newer commit holds
# its changes. A new push to a PR cancels that PR's run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  leak-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          # Same version as the pre-commit hook (.pre-commit-config.yaml); Renovate bumps both together.
          # renovate: datasource=github-releases depName=gitleaks/gitleaks extractVersion=^v(?<version>.*)$
          GITLEAKS_VERSION: 8.30.1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v10.3.3
        # Python comes from .python-version and every version from uv.lock (df-n8ac.12): the same
        # environment dev and prod install. Both uv's package cache and the Python download are cached.
        with: { enable-cache: true, cache-python: true }
      - name: leakguard (private files, personal data; every tracked file, read with -z)
        # No real data here, so no real-value check: that runs on the owner's machine (scripts/leakguard.py).
        run: uv run --no-project python scripts/leakguard.py --all
  quality:
    # Lint, dead code and import contracts may not grow past scripts/quality/baseline.json, and the
    # baseline may not rise against the PR's base branch (docs/quality-gate.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v10.3.3
        with: { enable-cache: true, cache-python: true }
      - name: Install the gate's tools (the quality group only)
        run: uv sync --frozen --only-group quality
      - name: Quality gate
        shell: bash   # pipefail: the gate's exit code survives the tee
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          mkdir -p report
          uv run --frozen --no-sync python scripts/quality/gate.py check ${BASE_REF:+--base-ref "$BASE_REF"} 2>&1 | tee report/quality.txt
      - uses: actions/upload-artifact@v7
        if: always()
        # Read by the report job, which comments on the PR.
        with: { name: report-quality, path: report/, if-no-files-found: ignore }
  # The engine suite runs split across shards (pytest-split, by each test's duration) and, inside each
  # shard, across the runner's cores (pytest-xdist): adding tests adds shards, not minutes (df-n8ac.13).
  # Every shard of a run uses the same shuffle seed (the run id), so the groups are disjoint and cover
  # the suite; a rerun keeps the seed. Each shard stores its own tests' durations, and the `tests` /
  # `tests-windows` jobs merge them into the cache the next run splits by. The required checks are
  # those two jobs, which pass only when every part passed.
  tests-shard:
    name: tests-shard (${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix: { shard: [1, 2] }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with: { enable-cache: true, cache-python: true }
      - name: Qt system libraries (some engine tests import the GUI modules)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: uv sync --frozen
      - name: Durations of the last run
        uses: actions/cache/restore@v6
        with: { path: .test_durations, key: "test-durations-linux-${{ github.run_id }}", restore-keys: test-durations-linux- }
      - name: Engine tests
        shell: bash
        # sys.monitoring tracer: branch coverage at a fraction of the C tracer's cost (Python 3.14+).
        env: { COVERAGE_CORE: sysmon, SHARD: "${{ matrix.shard }}" }
        run: |
          mkdir -p report
          uv run --frozen --no-sync python -m pytest tests -m 'not integration' --ignore-glob='tests/test_gui_*' -p no:cacheprovider \
            -n auto --randomly-seed=${{ github.run_id }} \
            --splits 2 --group "$SHARD" --store-durations --clean-durations \
            --cov=dataforge --cov-branch --cov-report= 2>&1 | tee "report/tests-engine-$SHARD.txt"
      - name: Name the coverage data after the shard
        if: always()
        run: if [ -f .coverage ]; then mv .coverage ".coverage.linux-${{ matrix.shard }}"; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: "coverage-part-linux-${{ matrix.shard }}", path: ".coverage.linux-*", include-hidden-files: true, if-no-files-found: ignore }
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: "durations-linux-${{ matrix.shard }}", path: .test_durations, include-hidden-files: true, if-no-files-found: ignore }
      - uses: actions/upload-artifact@v7
        if: always()
        # Read by the report job, which comments on the PR.
        with: { name: "report-tests-engine-${{ matrix.shard }}", path: report/, if-no-files-found: ignore }
  tests-gui:
    # Its own process: the GUI first crashed the full suite (df-t5cg). One job, not split: about 15 s.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with: { enable-cache: true, cache-python: true }
      - name: Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: uv sync --frozen
      - name: GUI tests
        shell: bash
        env: { QT_QPA_PLATFORM: offscreen, COVERAGE_CORE: sysmon }
        run: |
          mkdir -p report
          uv run --frozen --no-sync python -m pytest tests/test_gui_*.py -p no:cacheprovider \
            --cov=dataforge --cov-branch --cov-report= 2>&1 | tee report/tests-gui.txt
      - name: Name the coverage data after the job
        if: always()
        run: if [ -f .coverage ]; then mv .coverage .coverage.gui; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: coverage-part-gui, path: .coverage.gui, include-hidden-files: true, if-no-files-found: ignore }
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: report-tests-gui, path: report/, if-no-files-found: ignore }
  tests-getfinance:
    # The GetFinance workspace's pipeline tests (df-bsb2.2.2), on fake data. Run from the repo root,
    # so coverage.xml has the repo-relative paths Sonar reads; pytest takes workspaces/GetFinance/pytest.ini
    # (its own `tests` package cannot share a process with the engine's). The `integration` tests read
    # the real data, which only the owner's machine has (GETFINANCE_DATA): they stay out.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with: { enable-cache: true, cache-python: true }
      - name: Install
        run: uv sync --frozen
      - name: GetFinance tests
        shell: bash
        env: { COVERAGE_CORE: sysmon }
        run: |
          mkdir -p report
          uv run --frozen --no-sync python -m pytest workspaces/GetFinance -m 'not integration' -p no:cacheprovider \
            -n auto --randomly-seed=${{ github.run_id }} \
            --cov=workspaces/GetFinance/scripts --cov-branch --cov-report= 2>&1 | tee report/tests-getfinance.txt
      - name: Name the coverage data after the job
        if: always()
        run: if [ -f .coverage ]; then mv .coverage .coverage.getfinance; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: coverage-part-getfinance, path: .coverage.getfinance, include-hidden-files: true, if-no-files-found: ignore }
      - uses: actions/upload-artifact@v7
        if: always()
        # Read by the report job, which comments on the PR.
        with: { name: report-tests-getfinance, path: report/, if-no-files-found: ignore }
  app-financas:
    # The GetFinance web app (df-bsb2.2.3): unit tests, and the committed dist/ must be the build of
    # the current src/. The Playwright e2e stays local (it needs the finance_demo data and a browser).
    # Not a required check itself: the required `tests` job needs it, so a red app blocks the merge.
    runs-on: ubuntu-latest
    permissions: { contents: read }
    defaults: { run: { working-directory: workspaces/GetFinance/apps/financas } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: workspaces/GetFinance/apps/financas/package-lock.json
      - name: Install
        run: npm ci
      - name: Unit tests and build
        shell: bash   # pipefail: each command's exit code survives the tee
        run: |
          mkdir -p "$GITHUB_WORKSPACE/report"
          { npm test && npm run build; } 2>&1 | tee "$GITHUB_WORKSPACE/report/app-financas.txt"
      - name: Committed dist is the build
        shell: bash
        run: |
          changed=$(git status --porcelain --untracked-files=all -- dist)
          if [ -n "$changed" ]; then echo "dist differs from the build of src (run npm run build and commit dist):"; echo "$changed"; exit 1; fi
      - uses: actions/upload-artifact@v7
        if: always()
        # Read by the report job, which comments on the PR.
        with: { name: report-app-financas, path: report/, if-no-files-found: ignore }
  coverage:
    # Merges every part's coverage into the coverage.xml the sonar job reads, and the shards'
    # durations into the cache the next run splits by. Waits only for the jobs that write them, so
    # sonar starts without waiting for orders or the web app (df-n8ac.37).
    needs: [tests-shard, tests-gui, tests-getfinance]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with: { enable-cache: true, cache-python: true }
      - name: Install coverage (the dev group, without the project)
        run: uv sync --frozen --only-group dev
      - uses: actions/download-artifact@v8
        continue-on-error: true   # a part that died before writing coverage leaves no artifact
        with: { pattern: coverage-part-*, path: coverage-parts, merge-multiple: true }
      - name: Coverage report (every part merged, for the sonar job)
        run: |
          if ls coverage-parts/.coverage.* >/dev/null 2>&1; then
            uv run --frozen --no-sync python -m coverage combine coverage-parts
            uv run --frozen --no-sync python -m coverage xml -o coverage.xml
          else
            echo "no coverage data"
          fi
      - uses: actions/upload-artifact@v7
        # Read by the sonar job.
        with: { name: coverage, path: coverage.xml, if-no-files-found: ignore }
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with: { pattern: durations-linux-*, path: durations }
      - name: Merge the shards' durations
        id: durations
        shell: bash
        run: |
          if uv run --no-project python scripts/ci_durations.py; then echo "merged=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/cache/save@v6
        if: steps.durations.outputs.merged == 'true'
        with: { path: .test_durations, key: "test-durations-linux-${{ github.run_id }}" }
  tests:
    # Required check: every engine shard, the GUI job, the GetFinance tests, its web app, the
    # extra random orders (an order-dependent failure blocks the merge too, df-n8ac.29) and the
    # coverage merge passed.
    needs: [tests-shard, tests-gui, tests-getfinance, app-financas, orders, coverage]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every part passed
        env:
          SHARDS: "${{ needs.tests-shard.result }}"
          GUI: "${{ needs.tests-gui.result }}"
          GETFINANCE: "${{ needs.tests-getfinance.result }}"
          APP: "${{ needs.app-financas.result }}"
          ORDERS: "${{ needs.orders.result }}"
          COVERAGE: "${{ needs.coverage.result }}"
        run: |
          echo "tests-shard: $SHARDS, tests-gui: $GUI, tests-getfinance: $GETFINANCE, app-financas: $APP, orders: $ORDERS, coverage: $COVERAGE"
          [ "$SHARDS" = "success" ] && [ "$GUI" = "success" ] && [ "$GETFINANCE" = "success" ] && [ "$APP" = "success" ] && [ "$ORDERS" = "success" ] && [ "$COVERAGE" = "success" ]
  tests-windows-shard:
    # The engine tests on native Windows (df-ahua.24): the daily production job runs there, and 7 of
    # the 70 bugs on record existed only on Windows (NTFS path rules, quoting, cp1252). No coverage
    # (the sonar job reads the ubuntu run) and no GUI tests.
    name: tests-windows-shard (${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix: { shard: [1, 2, 3] }
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with: { enable-cache: true, cache-python: true }
      - name: Install
        run: uv sync --frozen
      - name: Durations of the last run
        uses: actions/cache/restore@v6
        with: { path: .test_durations, key: "test-durations-windows-${{ github.run_id }}", restore-keys: test-durations-windows-, enableCrossOsArchive: true }
      - name: Engine tests
        shell: bash   # pipefail: pytest's exit code survives the tee
        # Only stdout/stderr become UTF-8, so the report file is readable. PYTHONUTF8 stays unset:
        # open() without encoding= must keep the default production has: cp1252 up to Python 3.14,
        # UTF-8 from 3.15 (UTF-8 mode on by default, PEP 686; df-p0wm).
        env: { PYTHONIOENCODING: utf-8, SHARD: "${{ matrix.shard }}" }
        run: |
          mkdir -p report
          uv run --frozen --no-sync python -m pytest tests -m 'not integration' --ignore-glob='tests/test_gui_*' -p no:cacheprovider \
            -n auto --randomly-seed=${{ github.run_id }} \
            --splits 3 --group "$SHARD" --store-durations --clean-durations 2>&1 | tee "report/tests-windows-$SHARD.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: "durations-windows-${{ matrix.shard }}", path: .test_durations, include-hidden-files: true, if-no-files-found: ignore }
      - uses: actions/upload-artifact@v7
        if: always()
        # Read by the report job, which comments on the PR.
        with: { name: "report-tests-windows-${{ matrix.shard }}", path: report/, if-no-files-found: ignore }
  tests-getfinance-windows:
    # The GetFinance pipeline tests on native Windows (df-yivq): its daily job runs on Windows Python
    # in production, which has had bugs Linux never shows (df-i4vo: no time-zone database). Same
    # tests as tests-getfinance, without coverage (the sonar job reads the ubuntu run).
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with: { enable-cache: true, cache-python: true }
      - name: Install
        run: uv sync --frozen
      - name: GetFinance tests
        shell: bash   # pipefail: pytest's exit code survives the tee
        # Only stdout/stderr become UTF-8, so the report file is readable. PYTHONUTF8 stays unset:
        # open() without encoding= must keep the default production has: cp1252 up to Python 3.14,
        # UTF-8 from 3.15 (UTF-8 mode on by default, PEP 686; df-p0wm).
        env: { PYTHONIOENCODING: utf-8 }
        run: |
          mkdir -p report
          uv run --frozen --no-sync python -m pytest workspaces/GetFinance -m 'not integration' -p no:cacheprovider \
            -n auto --randomly-seed=${{ github.run_id }} 2>&1 | tee report/tests-getfinance-windows.txt
      - uses: actions/upload-artifact@v7
        if: always()
        # Read by the report job, which comments on the PR.
        with: { name: report-tests-getfinance-windows, path: report/, if-no-files-found: ignore }
  tests-windows:
    # Required check: every Windows shard, the GetFinance tests on Windows and the deploy smoke
    # passed. Merges the shards' durations for the next run.
    needs: [tests-windows-shard, tests-getfinance-windows, windows-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with: { enable-cache: true, cache-python: true }
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with: { pattern: durations-windows-*, path: durations }
      - name: Merge the shards' durations
        id: durations
        shell: bash
        run: |
          if uv run --no-project python scripts/ci_durations.py; then echo "merged=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/cache/save@v6
        if: steps.durations.outputs.merged == 'true'
        with: { path: .test_durations, key: "test-durations-windows-${{ github.run_id }}", enableCrossOsArchive: true }
      - name: Every part passed
        env:
          SHARDS: "${{ needs.tests-windows-shard.result }}"
          GETFINANCE: "${{ needs.tests-getfinance-windows.result }}"
          SMOKE: "${{ needs.windows-smoke.result }}"
        run: |
          echo "tests-windows-shard: $SHARDS, tests-getfinance-windows: $GETFINANCE, windows-smoke: $SMOKE"
          [ "$SHARDS" = "success" ] && [ "$GETFINANCE" = "success" ] && [ "$SMOKE" = "success" ]
  orders:
    # More shuffles of the engine suite on every PR and push, in parallel (df-n8ac.14): an
    # order-dependent test fails here with its seed in the run summary instead of in a later run.
    # Reproduce with the same pytest command plus --randomly-seed=<seed> (docs/testing.md).
    name: orders (${{ matrix.order }}/2)
    strategy:
      fail-fast: false
      matrix: { order: [1, 2] }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with: { enable-cache: true, cache-python: true }
      - name: Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: uv sync --frozen
      - name: Engine suite in another random order
        shell: bash
        env: { ORDER: "${{ matrix.order }}", RUN: "${{ github.run_id }}" }
        run: |
          mkdir -p report
          seed=$(( RUN + ORDER ))
          echo "orders $ORDER: --randomly-seed=$seed" >> "$GITHUB_STEP_SUMMARY"
          uv run --frozen --no-sync python -m pytest tests -m 'not integration' --ignore-glob='tests/test_gui_*' -p no:cacheprovider \
            -n auto --randomly-seed="$seed" 2>&1 | tee "report/orders-$ORDER.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: "report-orders-${{ matrix.order }}", path: report/, if-no-files-found: ignore }
  sonar:
    # SonarQube Cloud (df-ahua.1): coverage of new code, cognitive complexity, duplication, history.
    # Needs only the coverage merge, not the tests gate, so orders does not delay it (df-n8ac.37).
    # A complement to the quality job, not a replacement. Required on main (repo ruleset,
    # df-ahua.1.6): a failed gate fails this check and blocks the merge. Left out of the report
    # job, since the SonarQube Cloud bot comments its own result on the PR.
    needs: [coverage]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }   # blame and new-code detection
      - uses: actions/download-artifact@v8
        continue-on-error: true   # tests died before writing coverage: Sonar still analyzes, without it
        with: { name: coverage }
      - name: SonarQube Cloud scan
        # No token on fork PRs: skip instead of failing.
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          # qualitygate.wait: the scan waits for the server, so a failed gate fails this check.
          args: >
            -Dsonar.organization=${{ github.repository_owner }}
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
            -Dsonar.qualitygate.wait=true
  mutation-targets:
    # Which testloop.toml targets to mutate (df-gqke). On a PR, only those whose module, tests or
    # first-party imports changed, or every one when a shared file changed
    # (scripts/testloop/affected.py). On push to main and by hand: every target, which also
    # audits what PRs skipped. `matrix` has one item per shard of each target (`shards` in
    # testloop.toml, df-n8ac.32): a big target runs as several jobs.
    runs-on: ubuntu-latest
    outputs:
      targets: "${{ steps.pick.outputs.targets }}"
      matrix: "${{ steps.pick.outputs.matrix }}"
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }   # the merge base with the PR's base branch
      - uses: astral-sh/setup-uv@v10.3.3
        with: { enable-cache: true, cache-python: true }
      - id: pick
        name: Pick targets
        shell: bash
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          targets=$(uv run --no-project python scripts/testloop/affected.py ${BASE_REF:+--base-ref "$BASE_REF"})
          matrix=$(uv run --no-project python scripts/testloop/affected.py ${BASE_REF:+--base-ref "$BASE_REF"} --matrix)
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "mutation targets: $targets" >> "$GITHUB_STEP_SUMMARY"
  mutation:
    # One job per shard of each picked target, in parallel: each mutates its part and uploads its
    # .testloop/; mutation-ok sums the shards and gates the score. Skipped when no target was picked.
    needs: [mutation-targets]
    if: needs.mutation-targets.outputs.targets != '[]'
    name: mutation (${{ matrix.module }} ${{ matrix.shard }}/${{ matrix.shards }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.mutation-targets.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with: { enable-cache: true, cache-python: true }
      - name: Install into .venv (testloop.toml runs .venv/bin/python)
        run: uv sync --frozen
      # mutmut's verdicts per shard (df-n8ac.38): a PR restores those of main's last run and reuses
      # only the killed ones. It tests again every survivor, timeout and mutant without tests (a new
      # test may kill it), and every mutant of a function the PR changed (all of them when the pytest
      # arguments or the list of test files changed). A killed verdict stays even when a test changed:
      # push and manual runs start empty, mutate everything (the audit of what PRs reused, a weakened
      # test included) and save the cache for the next PRs. The key changes with the environment
      # (uv.lock, .python-version).
      - name: Cache key of the shard
        id: cache
        shell: bash
        env:
          MODULE: "${{ matrix.module }}"
          SHARD: "${{ matrix.shard }}"
          SHARDS: "${{ matrix.shards }}"
          ENV_HASH: "${{ hashFiles('uv.lock', '.python-version') }}"
        run: echo "prefix=mutmut-${MODULE//\//_}-${SHARD}of${SHARDS}-${ENV_HASH}-" >> "$GITHUB_OUTPUT"
      - name: Verdicts of main's last run
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v6
        with:
          path: "${{ runner.temp }}/mutmut-cache"
          key: "${{ steps.cache.outputs.prefix }}${{ github.run_id }}"
          restore-keys: "${{ steps.cache.outputs.prefix }}"
      - name: Mutate
        shell: bash
        env:
          MODULE: "${{ matrix.module }}"
          SHARD: "${{ matrix.shard }}"
          SHARDS: "${{ matrix.shards }}"
          CACHE: "${{ runner.temp }}/mutmut-cache"
        run: .venv/bin/python scripts/testloop/cli.py mutate "$MODULE" --shard "$SHARD/$SHARDS" --cache-dir "$CACHE"
      - name: Save the verdicts for the next PRs
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v6
        with:
          path: "${{ runner.temp }}/mutmut-cache"
          key: "${{ steps.cache.outputs.prefix }}${{ github.run_id }}"
      # Artifact names must be unique across the matrix and cannot hold '/': use the job index.
      - uses: actions/upload-artifact@v7
        if: always()
        # .testloop/ is a hidden directory, which upload-artifact skips unless told otherwise.
        with: { name: "testloop-results-${{ strategy.job-index }}", path: .testloop/, include-hidden-files: true, if-no-files-found: warn }
  mutation-ok:
    # One fixed name for the repo ruleset to require (df-ahua.19): the matrix jobs are named per
    # shard and are skipped when no target is picked, so none of them can be a required check.
    # It gates each picked target on its shards' results summed (df-n8ac.32). Passes when every
    # gate passed or no target was picked; fails when the pick itself failed (which leaves
    # mutation skipped), any mutation job failed or was cancelled, or any gate did not pass (a
    # missing or partial shard is a gate error, exit 2).
    needs: [mutation-targets, mutation]
    if: always()
    runs-on: ubuntu-latest
    env:
      GATE: ${{ needs.mutation-targets.result == 'success' && needs.mutation-targets.outputs.targets != '[]' }}
    steps:
      - uses: actions/checkout@v7
        if: env.GATE == 'true'
      - uses: astral-sh/setup-uv@v10.3.3
        if: env.GATE == 'true'
        with: { enable-cache: true, cache-python: true }
      - uses: actions/download-artifact@v8
        if: env.GATE == 'true'
        continue-on-error: true   # a job that died before writing anything leaves no artifact
        with: { pattern: testloop-results-*, path: .testloop, merge-multiple: true }
      - name: Gate each target on its shards
        if: env.GATE == 'true'
        shell: bash
        env: { TARGETS: "${{ needs.mutation-targets.outputs.targets }}" }
        run: |
          mkdir -p report
          failed=0
          # gate only reads JSON and testloop.toml (stdlib): no project install needed.
          for module in $(jq -r '.[]' <<< "$TARGETS"); do
            out="report/mutation-${module//\//_}.txt"
            uv run --no-project python scripts/testloop/cli.py gate "$module" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" "$out" || failed=1
          done
          exit "$failed"
      - uses: actions/upload-artifact@v7
        if: always()
        # Read by the report job, which comments on the PR.
        # Also each target's gate-<module>.json, which the mutation jobs no longer write (df-0klw).
        with:
          name: report-mutation-gate
          path: |
            report/
            .testloop/gate-*.json
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Check the mutation jobs
        if: always()
        env:
          PICK: ${{ needs.mutation-targets.result }}
          MUTATION: ${{ needs.mutation.result }}
        run: |
          echo "mutation-targets: $PICK, mutation: $MUTATION"
          [ "$PICK" = "success" ] || exit 1
          [ "$MUTATION" = "success" ] || [ "$MUTATION" = "skipped" ] || exit 1
  testloop-tools:
    # Tests of the test loop tools themselves (map, check, mutate, gate).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with: { enable-cache: true, cache-python: true }
      - name: Install
        run: uv sync --frozen
      - name: Test loop tool tests
        shell: bash
        run: |
          mkdir -p report
          uv run --frozen --no-sync python -m pytest tests/test_testloop.py -p no:cacheprovider 2>&1 | tee report/testloop-tools.txt
      - uses: actions/upload-artifact@v7
        if: always()
        # Read by the report job, which comments on the PR.
        with: { name: report-testloop-tools, path: report/, if-no-files-found: ignore }
  windows-smoke:
    # Deploy path guards on native Windows (df-llmm): NTFS drops a trailing dot or space, reads ':'
    # as a stream and ignores case, which no Linux test reproduces (scripts/smoke_deploy_windows.py).
    # Then installs a release the way update-prod.ps1 does on prod, with no C compiler (df-mvls).
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with: { enable-cache: true, cache-python: true }
      - name: Install runtime dependencies (prod's, from uv.lock, minus PySide6, which deploy never imports)
        run: >
          uv sync --frozen --no-default-groups
          --no-install-package pyside6 --no-install-package pyside6-essentials
          --no-install-package pyside6-addons --no-install-package shiboken6
      - name: Deploy smoke
        shell: bash   # pipefail: the smoke's exit code survives the tee
        run: |
          mkdir -p report
          uv run --frozen --no-sync python scripts/smoke_deploy_windows.py 2>&1 | tee report/windows-smoke.txt
      - name: Install like prod, which has no C compiler
        # This runner has MSVC and prod does not, so a dependency with no wheel for prod's Python
        # builds here and fails only at the deploy (df-gwjh, df-mvls). Runs update-prod.ps1 as
        # deploy.sh does, into a fresh venv, with pip refusing every source build but PyYAML's,
        # which update-prod makes pure Python (PYYAML_FORCE_LIBYAML=0). A pure-Python package with
        # no wheel joins the no-binary line; one that needs C needs a wheel before it can ship.
        if: ${{ !cancelled() }}
        shell: pwsh
        env: { PIP_CONFIG_FILE: "${{ runner.temp }}/pip-no-compiler.ini" }
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          "[install]`nonly-binary = :all:`nno-binary = pyyaml" | Set-Content -LiteralPath $env:PIP_CONFIG_FILE
          $work = Join-Path $env:RUNNER_TEMP "prod-install"
          $python = (Get-Content .python-version).Trim()
          uv build --quiet --wheel --out-dir $work .
          uv export --quiet --frozen --no-default-groups --no-emit-project --no-hashes --output-file "$work/constraints.txt"
          uv venv --no-project --seed --python $python "$work/venv"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/prod/update-prod.ps1 `
            -VenvPath "$work/venv" -DataForgeHome $work -Wheel (Get-Item "$work/dataforge-*.whl").FullName `
            -Constraints "$work/constraints.txt" -Requirements workspaces/GetFinance/requirements.txt -Python $python
      - uses: actions/upload-artifact@v7
        if: always()
        # Read by the report job, which comments on the PR.
        with: { name: report-windows-smoke, path: report/, if-no-files-found: ignore }
  report:
    # One comment on the PR with every job's result and output, edited on each push (scripts/ci_report.py).
    if: always() && github.event_name == 'pull_request'
    # mutation-targets: a failed pick leaves mutation skipped, which alone would read as fine.
    # mutation-ok: it writes the mutation gate's report (df-n8ac.32).
    needs: [leak-scan, quality, tests, tests-getfinance, app-financas, tests-windows, tests-getfinance-windows, orders, mutation-targets, mutation, mutation-ok, testloop-tools, windows-smoke]
    runs-on: ubuntu-latest
    permissions: { contents: read, issues: write, pull-requests: write }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        continue-on-error: true   # a job that died before writing anything leaves no artifact
        with: { pattern: report-*, path: report, merge-multiple: true }
      - name: Comment the CI report on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: ${{ toJSON(needs) }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/ci_report.py
