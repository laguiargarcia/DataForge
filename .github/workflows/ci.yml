name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  leak-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: leakguard (PII + private-path block over all tracked files)
        run: python3 scripts/leakguard.py $(git ls-files)
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: pip install -e . pytest==9.2.0 -r scripts/testloop/requirements.txt
      - name: Engine tests
        run: python -m pytest tests -m 'not integration' --ignore-glob='tests/test_gui_*' -p no:cacheprovider
      - name: GUI tests (separate run; GUI first crashes the full suite)
        env: { QT_QPA_PLATFORM: offscreen }
        run: python -m pytest tests/test_gui_*.py -p no:cacheprovider
