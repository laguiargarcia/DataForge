name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly, to catch breakage from new dependency releases
  workflow_dispatch:
jobs:
  leak-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          # Same version as the pre-commit hook (.pre-commit-config.yaml): bump both together.
          GITLEAKS_VERSION: 8.24.3
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: leakguard (PII + private-path block over all tracked files)
        run: python3 scripts/leakguard.py $(git ls-files)
  quality:
    # Lint, dead code and import contracts may not grow past scripts/quality/baseline.json, and the
    # baseline may not rise against the PR's base branch (docs/quality-gate.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Install
        run: pip install -r scripts/quality/requirements.txt
      - name: Quality gate
        shell: bash   # pipefail: the gate's exit code survives the tee
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          mkdir -p report
          python scripts/quality/gate.py check ${BASE_REF:+--base-ref "$BASE_REF"} 2>&1 | tee report/quality.txt
      - uses: actions/upload-artifact@v7
        if: always()
        # Read by the report job, which comments on the PR.
        with: { name: report-quality, path: report/, if-no-files-found: ignore }
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        # httpx2 (every test job): tests/conftest.py loads starlette.testclient, which deprecates httpx.
        run: pip install -e . pytest==9.2.0 httpx2==2.16.0 -r scripts/testloop/requirements.txt
      - name: Engine tests
        shell: bash
        run: |
          mkdir -p report
          python -m pytest tests -m 'not integration' --ignore-glob='tests/test_gui_*' -p no:cacheprovider \
            --cov=dataforge --cov-branch --cov-report= 2>&1 | tee report/tests-engine.txt
      - name: GUI tests (separate run; GUI first crashes the full suite)
        shell: bash
        env: { QT_QPA_PLATFORM: offscreen }
        run: |
          python -m pytest tests/test_gui_*.py -p no:cacheprovider \
            --cov=dataforge --cov-branch --cov-append --cov-report= 2>&1 | tee report/tests-gui.txt
      - name: Coverage report (both runs merged, for the sonar job)
        if: always()
        run: if [ -f .coverage ]; then python -m coverage xml -o coverage.xml; else echo "no coverage data"; fi
      - uses: actions/upload-artifact@v7
        if: always()
        # Read by the report job, which comments on the PR.
        with: { name: report-tests, path: report/, if-no-files-found: ignore }
      - uses: actions/upload-artifact@v7
        if: always()
        # Read by the sonar job.
        with: { name: coverage, path: coverage.xml, if-no-files-found: ignore }
  sonar:
    # SonarQube Cloud (df-ahua.1): coverage of new code, cognitive complexity, duplication, history.
    # A complement to the quality job, not a replacement. Not required yet (df-ahua.1.6): a failed
    # gate fails this check without blocking the merge. Left out of the report job, since the
    # SonarQube Cloud bot comments its own result on the PR.
    needs: [tests]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }   # blame and new-code detection
      - uses: actions/download-artifact@v8
        continue-on-error: true   # tests died before writing coverage: Sonar still analyzes, without it
        with: { name: coverage }
      - name: SonarQube Cloud scan
        # No token on fork PRs: skip instead of failing.
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          # qualitygate.wait: the scan waits for the server, so a failed gate fails this check.
          args: >
            -Dsonar.organization=${{ github.repository_owner }}
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
            -Dsonar.qualitygate.wait=true
  mutation:
    # Mutation score of each module in testloop.toml must stay at or above its min_score.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Install into .venv (testloop.toml runs .venv/bin/python)
        run: python -m venv .venv && .venv/bin/pip install -e . pytest==9.2.0 httpx2==2.16.0 -r scripts/testloop/requirements.txt
      - name: Mutate and gate each target
        shell: bash
        run: |
          status=0
          mkdir -p report
          for module in $(.venv/bin/python -c 'import tomllib; print("\n".join(tomllib.load(open("testloop.toml", "rb"))["targets"]))'); do
            out="report/mutation-${module//\//_}.txt"
            .venv/bin/python scripts/testloop/cli.py mutate "$module" || { echo "testloop: mutate $module failed" > "$out"; status=1; continue; }
            .venv/bin/python scripts/testloop/cli.py gate "$module" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" "$out" || status=1
          done
          exit $status
      - uses: actions/upload-artifact@v7
        if: always()
        # .testloop/ is a hidden directory, which upload-artifact skips unless told otherwise.
        with: { name: testloop-results, path: .testloop/, include-hidden-files: true, if-no-files-found: warn }
      - uses: actions/upload-artifact@v7
        if: always()
        # Read by the report job, which comments on the PR.
        with: { name: report-mutation, path: report/, if-no-files-found: ignore }
  testloop-tools:
    # Tests of the test loop tools themselves (map, check, mutate, gate).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Install
        run: pip install -e . pytest==9.2.0 httpx2==2.16.0 -r scripts/testloop/requirements.txt
      - name: Test loop tool tests
        shell: bash
        run: |
          mkdir -p report
          python -m pytest tests/test_testloop.py -p no:cacheprovider 2>&1 | tee report/testloop-tools.txt
      - uses: actions/upload-artifact@v7
        if: always()
        # Read by the report job, which comments on the PR.
        with: { name: report-testloop-tools, path: report/, if-no-files-found: ignore }
  windows-smoke:
    # Deploy path guards on native Windows (df-llmm): NTFS drops a trailing dot or space, reads ':'
    # as a stream and ignores case, which no Linux test reproduces (scripts/smoke_deploy_windows.py).
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Install runtime dependencies (all of pyproject's but PySide6, which deploy never imports)
        shell: bash
        run: |
          python -c "import tomllib; deps = tomllib.load(open('pyproject.toml', 'rb'))['project']['dependencies']; print('\n'.join(d for d in deps if not d.lower().startswith('pyside6')))" > deps.txt
          python -m pip install -r deps.txt
      - name: Deploy smoke
        shell: bash   # pipefail: the smoke's exit code survives the tee
        env: { PYTHONPATH: "${{ github.workspace }}" }
        run: |
          mkdir -p report
          python scripts/smoke_deploy_windows.py 2>&1 | tee report/windows-smoke.txt
      - uses: actions/upload-artifact@v7
        if: always()
        # Read by the report job, which comments on the PR.
        with: { name: report-windows-smoke, path: report/, if-no-files-found: ignore }
  report:
    # One comment on the PR with every job's result and output, edited on each push (scripts/ci_report.py).
    if: always() && github.event_name == 'pull_request'
    needs: [leak-scan, quality, tests, mutation, testloop-tools, windows-smoke]
    runs-on: ubuntu-latest
    permissions: { contents: read, issues: write, pull-requests: write }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        continue-on-error: true   # a job that died before writing anything leaves no artifact
        with: { pattern: report-*, path: report, merge-multiple: true }
      - name: Comment the CI report on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: ${{ toJSON(needs) }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/ci_report.py
