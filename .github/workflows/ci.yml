name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly, to catch breakage from new dependency releases
  workflow_dispatch:
# One run at a time per ref (df-huj7). On main, runs queue instead of overlapping: SonarCloud refuses
# an analysis of an older commit submitted after a newer one, which failed the sonar job when merges
# landed seconds apart. A queued run that a newer push replaces is cancelled; the newer commit holds
# its changes. A new push to a PR cancels that PR's run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  leak-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          # Same version as the pre-commit hook (.pre-commit-config.yaml): bump both together.
          GITLEAKS_VERSION: 8.24.3
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: leakguard (PII + private-path block over all tracked files)
        run: python3 scripts/leakguard.py $(git ls-files)
  quality:
    # Lint, dead code and import contracts may not grow past scripts/quality/baseline.json, and the
    # baseline may not rise against the PR's base branch (docs/quality-gate.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Install
        run: pip install -r scripts/quality/requirements.txt
      - name: Quality gate
        shell: bash   # pipefail: the gate's exit code survives the tee
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          mkdir -p report
          python scripts/quality/gate.py check ${BASE_REF:+--base-ref "$BASE_REF"} 2>&1 | tee report/quality.txt
      - uses: actions/upload-artifact@v7
        if: always()
        # Read by the report job, which comments on the PR.
        with: { name: report-quality, path: report/, if-no-files-found: ignore }
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          # pip download cache, keyed on the files that pin the dependencies (df-0jhm).
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            scripts/testloop/requirements.txt
      - name: Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        # httpx2 (every test job): tests/conftest.py loads starlette.testclient, which deprecates httpx.
        run: pip install -e . pytest==9.2.0 httpx2==2.16.0 -r scripts/testloop/requirements.txt
      - name: Engine tests
        shell: bash
        run: |
          mkdir -p report
          python -m pytest tests -m 'not integration' --ignore-glob='tests/test_gui_*' -p no:cacheprovider \
            --cov=dataforge --cov-branch --cov-report= 2>&1 | tee report/tests-engine.txt
      - name: GUI tests (separate run; GUI first crashes the full suite)
        shell: bash
        env: { QT_QPA_PLATFORM: offscreen }
        run: |
          # Fixed order (-p no:randomly) until df-3yh is fixed: shuffled, the GUI tests segfault
          # intermittently (the uvicorn daemon thread of test_gui_daemon dies mid-import).
          python -m pytest tests/test_gui_*.py -p no:cacheprovider -p no:randomly \
            --cov=dataforge --cov-branch --cov-append --cov-report= 2>&1 | tee report/tests-gui.txt
      - name: Coverage report (both runs merged, for the sonar job)
        if: always()
        run: if [ -f .coverage ]; then python -m coverage xml -o coverage.xml; else echo "no coverage data"; fi
      - uses: actions/upload-artifact@v7
        if: always()
        # Read by the report job, which comments on the PR.
        with: { name: report-tests, path: report/, if-no-files-found: ignore }
      - uses: actions/upload-artifact@v7
        if: always()
        # Read by the sonar job.
        with: { name: coverage, path: coverage.xml, if-no-files-found: ignore }
  tests-windows:
    # The engine tests on native Windows (df-ahua.24): the daily production job runs there, and 7 of
    # the 70 bugs on record existed only on Windows (NTFS path rules, quoting, cp1252). A separate
    # job, not a matrix on `tests`: the repo ruleset requires a check named exactly `tests`. No
    # coverage (the sonar job reads the ubuntu run) and no GUI tests.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          # pip download cache, keyed on the files that pin the dependencies (df-0jhm).
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            scripts/testloop/requirements.txt
      - name: Install
        run: pip install -e . pytest==9.2.0 httpx2==2.16.0 -r scripts/testloop/requirements.txt
      - name: Engine tests
        shell: bash   # pipefail: pytest's exit code survives the tee
        # Only stdout/stderr become UTF-8, so the report file is readable. PYTHONUTF8 stays unset:
        # open() without encoding= must keep the cp1252 default that production has.
        env: { PYTHONIOENCODING: utf-8 }
        run: |
          mkdir -p report
          python -m pytest tests -m 'not integration' --ignore-glob='tests/test_gui_*' -p no:cacheprovider 2>&1 | tee report/tests-windows.txt
      - uses: actions/upload-artifact@v7
        if: always()
        # Read by the report job, which comments on the PR.
        with: { name: report-tests-windows, path: report/, if-no-files-found: ignore }
  sonar:
    # SonarQube Cloud (df-ahua.1): coverage of new code, cognitive complexity, duplication, history.
    # A complement to the quality job, not a replacement. Required on main (repo ruleset,
    # df-ahua.1.6): a failed gate fails this check and blocks the merge. Left out of the report
    # job, since the SonarQube Cloud bot comments its own result on the PR.
    needs: [tests]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }   # blame and new-code detection
      - uses: actions/download-artifact@v8
        continue-on-error: true   # tests died before writing coverage: Sonar still analyzes, without it
        with: { name: coverage }
      - name: SonarQube Cloud scan
        # No token on fork PRs: skip instead of failing.
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          # qualitygate.wait: the scan waits for the server, so a failed gate fails this check.
          args: >
            -Dsonar.organization=${{ github.repository_owner }}
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
            -Dsonar.qualitygate.wait=true
  mutation-targets:
    # Which testloop.toml targets to mutate (df-gqke). On a PR, only those whose module, tests or
    # first-party imports changed, or every one when a shared file changed
    # (scripts/testloop/affected.py). On push to main, weekly and by hand: every target, which also
    # audits what PRs skipped.
    runs-on: ubuntu-latest
    outputs: { targets: "${{ steps.pick.outputs.targets }}" }
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }   # the merge base with the PR's base branch
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - id: pick
        name: Pick targets
        shell: bash
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          targets=$(python scripts/testloop/affected.py ${BASE_REF:+--base-ref "$BASE_REF"})
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "mutation targets: $targets" >> "$GITHUB_STEP_SUMMARY"
  mutation:
    # Mutation score of each picked target must stay at or above its min_score. One job per target,
    # in parallel; skipped when no target was picked.
    needs: [mutation-targets]
    if: needs.mutation-targets.outputs.targets != '[]'
    name: mutation (${{ matrix.module }})
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.mutation-targets.outputs.targets) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          # pip download cache, keyed on the files that pin the dependencies (df-0jhm).
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            scripts/testloop/requirements.txt
      - name: Install into .venv (testloop.toml runs .venv/bin/python)
        run: python -m venv .venv && .venv/bin/pip install -e . pytest==9.2.0 httpx2==2.16.0 -r scripts/testloop/requirements.txt
      - name: Mutate and gate
        shell: bash
        env: { MODULE: "${{ matrix.module }}" }
        run: |
          mkdir -p report
          out="report/mutation-${MODULE//\//_}.txt"
          .venv/bin/python scripts/testloop/cli.py mutate "$MODULE" || { echo "testloop: mutate $MODULE failed" > "$out"; exit 1; }
          .venv/bin/python scripts/testloop/cli.py gate "$MODULE" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" "$out"
      # Artifact names must be unique across the matrix and cannot hold '/': use the job index.
      - uses: actions/upload-artifact@v7
        if: always()
        # .testloop/ is a hidden directory, which upload-artifact skips unless told otherwise.
        with: { name: "testloop-results-${{ strategy.job-index }}", path: .testloop/, include-hidden-files: true, if-no-files-found: warn }
      - uses: actions/upload-artifact@v7
        if: always()
        # Read by the report job, which comments on the PR.
        with: { name: "report-mutation-${{ strategy.job-index }}", path: report/, if-no-files-found: ignore }
  mutation-ok:
    # One fixed name for the repo ruleset to require (df-ahua.19): the matrix jobs are named per
    # module and are skipped when no target is picked, so none of them can be a required check.
    # Passes when every picked target passed or none was picked; fails when the pick itself failed
    # (which leaves mutation skipped) or any target failed or was cancelled.
    needs: [mutation-targets, mutation]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check the mutation jobs
        env:
          PICK: ${{ needs.mutation-targets.result }}
          MUTATION: ${{ needs.mutation.result }}
        run: |
          echo "mutation-targets: $PICK, mutation: $MUTATION"
          [ "$PICK" = "success" ] || exit 1
          [ "$MUTATION" = "success" ] || [ "$MUTATION" = "skipped" ] || exit 1
  testloop-tools:
    # Tests of the test loop tools themselves (map, check, mutate, gate).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          # pip download cache, keyed on the files that pin the dependencies (df-0jhm).
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            scripts/testloop/requirements.txt
      - name: Install
        run: pip install -e . pytest==9.2.0 httpx2==2.16.0 -r scripts/testloop/requirements.txt
      - name: Test loop tool tests
        shell: bash
        run: |
          mkdir -p report
          python -m pytest tests/test_testloop.py -p no:cacheprovider 2>&1 | tee report/testloop-tools.txt
      - uses: actions/upload-artifact@v7
        if: always()
        # Read by the report job, which comments on the PR.
        with: { name: report-testloop-tools, path: report/, if-no-files-found: ignore }
  windows-smoke:
    # Deploy path guards on native Windows (df-llmm): NTFS drops a trailing dot or space, reads ':'
    # as a stream and ignores case, which no Linux test reproduces (scripts/smoke_deploy_windows.py).
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Install runtime dependencies (all of pyproject's but PySide6, which deploy never imports)
        shell: bash
        run: |
          python -c "import tomllib; deps = tomllib.load(open('pyproject.toml', 'rb'))['project']['dependencies']; print('\n'.join(d for d in deps if not d.lower().startswith('pyside6')))" > deps.txt
          python -m pip install -r deps.txt
      - name: Deploy smoke
        shell: bash   # pipefail: the smoke's exit code survives the tee
        env: { PYTHONPATH: "${{ github.workspace }}" }
        run: |
          mkdir -p report
          python scripts/smoke_deploy_windows.py 2>&1 | tee report/windows-smoke.txt
      - uses: actions/upload-artifact@v7
        if: always()
        # Read by the report job, which comments on the PR.
        with: { name: report-windows-smoke, path: report/, if-no-files-found: ignore }
  flaky-hunt:
    # Order-dependent tests (df-ahua.8): the engine suite five times, each in a fresh random order
    # (pytest-randomly). Weekly and by hand only. A failed run names its seed; the same command with
    # --randomly-seed=<seed> reproduces the order locally (docs/testing.md).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            scripts/testloop/requirements.txt
      - name: Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: pip install -e . pytest==9.2.0 httpx2==2.16.0 -r scripts/testloop/requirements.txt
      - name: Engine suite in five random orders
        shell: bash
        run: |
          failed=""
          for run in 1 2 3 4 5; do
            seed=$SRANDOM   # bash 5.1+: 32 random bits per read
            echo "::group::run $run: --randomly-seed=$seed"
            python -m pytest tests -m 'not integration' --ignore-glob='tests/test_gui_*' -p no:cacheprovider -q \
              --randomly-seed="$seed" || failed="$failed $seed"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "flaky-hunt: the engine suite failed with --randomly-seed:$failed" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "flaky-hunt: five random orders passed" >> "$GITHUB_STEP_SUMMARY"
  report:
    # One comment on the PR with every job's result and output, edited on each push (scripts/ci_report.py).
    if: always() && github.event_name == 'pull_request'
    # mutation-targets: a failed pick leaves mutation skipped, which alone would read as fine.
    needs: [leak-scan, quality, tests, tests-windows, mutation-targets, mutation, testloop-tools, windows-smoke]
    runs-on: ubuntu-latest
    permissions: { contents: read, issues: write, pull-requests: write }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        continue-on-error: true   # a job that died before writing anything leaves no artifact
        with: { pattern: report-*, path: report, merge-multiple: true }
      - name: Comment the CI report on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: ${{ toJSON(needs) }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/ci_report.py
