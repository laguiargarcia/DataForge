title = "DataForge leak-scan"

[extend]
useDefault = true

# gitleaks default rules target secrets/tokens, API keys, etc.
# CPF/CNPJ patterns are not in the default ruleset, so no allowlist is needed here for the
# made-up document numbers of the synthetic data and the tests. scripts/leakguard.py checks
# CPF/CNPJ itself: only a number with valid check digits is a finding, so made-up ones pass.
